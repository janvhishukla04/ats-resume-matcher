<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATS Resume Matcher</title>
<style>
  :root { --bg:#0d1117;--panel:#11161d;--line:#1f2a33;--scan:#39ff88;--scan-dim:#1d6b3f;--text:#d7e2e9;--text-dim:#6b7e8c;--warn:#ff5c5c;--mono:'IBM Plex Mono','Courier New',monospace;--sans:'Inter',-apple-system,sans-serif; }
  *{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
  .scanline{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--scan),transparent);animation:sweep 4s linear infinite;opacity:0.5;z-index:5;pointer-events:none;}
  @keyframes sweep{0%{transform:translateY(0)}100%{transform:translateY(100vh)}}
  header{padding:28px 40px 18px;border-bottom:1px solid var(--line);}
  .eyebrow{font-family:var(--mono);font-size:12px;color:var(--scan);letter-spacing:.15em;text-transform:uppercase;}
  h1{font-size:28px;margin:6px 0 4px;font-weight:600;}
  .sub{color:var(--text-dim);font-size:14px;}
  main{max-width:880px;margin:0 auto;padding:40px 24px 80px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px;margin-bottom:24px;}
  .panel h2{font-family:var(--mono);font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;margin:0 0 16px;}
  label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:8px;}
  .dropzone{border:1px dashed var(--line);border-radius:4px;padding:28px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;font-family:var(--mono);font-size:13px;color:var(--text-dim);}
  .dropzone:hover,.dropzone.drag{border-color:var(--scan);background:rgba(57,255,136,.04);color:var(--scan);}
  .dropzone.filled{border-color:var(--scan-dim);color:var(--text);}
  textarea,input[type="text"]{width:100%;background:#0a0e13;border:1px solid var(--line);border-radius:4px;color:var(--text);padding:12px 14px;font-family:var(--sans);font-size:14px;resize:vertical;}
  textarea{min-height:140px;margin-top:6px;} input[type="text"]{margin-top:6px;margin-bottom:16px;}
  textarea:focus,input:focus{outline:2px solid var(--scan);outline-offset:1px;}
  button{font-family:var(--mono);background:var(--scan);color:#08130c;border:none;padding:13px 24px;border-radius:4px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;margin-top:18px;transition:transform .1s,box-shadow .2s;}
  button:hover{box-shadow:0 0 18px rgba(57,255,136,.35);} button:active{transform:scale(.98);}
  button:disabled{background:var(--scan-dim);cursor:not-allowed;box-shadow:none;}
  #result{display:none;}
  .score-wrap{display:flex;align-items:center;gap:24px;}
  .score-ring{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:26px;font-weight:600;border:3px solid var(--scan);flex-shrink:0;}
  .verdict{font-size:15px;line-height:1.5;}
  .keywords{margin-top:20px;}
  .kw-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .kw{font-family:var(--mono);font-size:12px;background:rgba(255,92,92,.08);color:var(--warn);border:1px solid rgba(255,92,92,.3);padding:5px 10px;border-radius:4px;}
  .error{color:var(--warn);font-family:var(--mono);font-size:13px;margin-top:12px;}
  footer{text-align:center;color:var(--text-dim);font-size:12px;padding:20px;font-family:var(--mono);}
</style>
</head>
<body>
<div class="scanline"></div>
<header>
  <div class="eyebrow">// resume_scanner.exe</div>
  <h1>ATS Resume Matcher</h1>
  <div class="sub">See your resume the way the bots see it — before a recruiter ever does.</div>
</header>
<main>
  <div class="panel">
    <h2>01 — Upload</h2>
    <label>Resume (PDF only)</label>
    <div class="dropzone" id="dropzone">Drop your resume here, or click to browse</div>
    <input type="file" id="fileInput" accept=".pdf" style="display:none">
    <div style="margin-top:22px;">
      <label>Job title (optional)</label>
      <input type="text" id="jobTitle" placeholder="e.g. Backend Developer Intern">
      <label>Job description</label>
      <textarea id="jobDesc" placeholder="Paste the full job description here..."></textarea>
    </div>
    <button id="analyzeBtn">Run Scan</button>
    <div class="error" id="errorBox"></div>
  </div>
  <div class="panel" id="result">
    <h2>02 — Result</h2>
    <div class="score-wrap">
      <div class="score-ring" id="scoreRing">--%</div>
      <div class="verdict" id="verdictText"></div>
    </div>
    <div class="keywords">
      <label>Keywords missing from your resume</label>
      <div class="kw-list" id="kwList"></div>
    </div>
  </div>
</main>
<footer>Built with FastAPI · scikit-learn · SQLAlchemy — no resume data leaves this server</footer>
<script>
  const dropzone=document.getElementById('dropzone'),fileInput=document.getElementById('fileInput'),analyzeBtn=document.getElementById('analyzeBtn'),errorBox=document.getElementById('errorBox'),resultPanel=document.getElementById('result');
  let selectedFile=null;
  dropzone.addEventListener('click',()=>fileInput.click());
  dropzone.addEventListener('dragover',e=>{e.preventDefault();dropzone.classList.add('drag');});
  dropzone.addEventListener('dragleave',()=>dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop',e=>{e.preventDefault();dropzone.classList.remove('drag');if(e.dataTransfer.files.length)setFile(e.dataTransfer.files[0]);});
  fileInput.addEventListener('change',e=>{if(e.target.files.length)setFile(e.target.files[0]);});
  function setFile(file){if(!file.name.toLowerCase().endsWith('.pdf')){errorBox.textContent='Only PDF files are supported.';return;}errorBox.textContent='';selectedFile=file;dropzone.textContent='✓ '+file.name;dropzone.classList.add('filled');}
  analyzeBtn.addEventListener('click',async()=>{
    errorBox.textContent='';
    const jobDesc=document.getElementById('jobDesc').value.trim();
    if(!selectedFile){errorBox.textContent='Please upload your resume PDF.';return;}
    if(!jobDesc){errorBox.textContent='Please paste a job description.';return;}
    analyzeBtn.disabled=true;analyzeBtn.textContent='Scanning...';
    const formData=new FormData();
    formData.append('resume',selectedFile);
    formData.append('job_description',jobDesc);
    formData.append('job_title',document.getElementById('jobTitle').value.trim());
    try{
      const res=await fetch('/analyze',{method:'POST',body:formData});
      if(!res.ok){const err=await res.json();throw new Error(err.detail||'Something went wrong.');}
      renderResult(await res.json());
    }catch(err){errorBox.textContent=err.message;}
    finally{analyzeBtn.disabled=false;analyzeBtn.textContent='Run Scan';}
  });
  function renderResult(data){
    resultPanel.style.display='block';
    const ring=document.getElementById('scoreRing');
    ring.textContent=data.score+'%';
    ring.style.borderColor=data.score>=75?'#39ff88':data.score>=50?'#e8c547':'#ff5c5c';
    document.getElementById('verdictText').textContent=data.verdict;
    const kwList=document.getElementById('kwList');kwList.innerHTML='';
    if(!data.missing_keywords.length){kwList.innerHTML='<span class="kw" style="color:#39ff88;border-color:#39ff88;background:rgba(57,255,136,0.08)">No major gaps found</span>';}
    else{data.missing_keywords.forEach(kw=>{const s=document.createElement('span');s.className='kw';s.textContent=kw;kwList.appendChild(s);});}
    resultPanel.scrollIntoView({behavior:'smooth'});
  }
</script>
</body>
</html>
